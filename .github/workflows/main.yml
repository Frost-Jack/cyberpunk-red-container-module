name: Build Module Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to validate and package (does not publish)
        required: true
        default: v1.0
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Test module
        run: npm test

      - name: Build and validate release assets
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: python3 .github/scripts/build_release.py

      - name: Save build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: module-release
          path: |
            dist/module.json
            dist/module.zip
          if-no-files-found: error

      - name: Attach assets to published release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/module.json dist/module.zip --clobber
